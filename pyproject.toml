[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "blablalink-tasker"
version = "0.1.0"
description = "BlablaLink/NIKKE community daily task command-line automation"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "playwright>=1.48",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
]

[project.scripts]
blablalink-tasker = "blablalink_tasker.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
